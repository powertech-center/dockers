test-rust:
  extends: .test-job

test-csharp:
  extends: .test-job

test-nodejs:
  extends: .test-job

test-mobile:
  extends: .test-job

test-cross-clang:
  extends: .test-job

test-cross-go:
  extends: .test-job

test-cross-rust:
  extends: .test-job

test-cross-csharp:
