# PowerTech Docker Images — GitLab CI/CD
#
# Every job runs `make <job-name> -j8` on the VPS (tag: linux).
# All jobs are manual and have no inter-stage dependencies.
#
# GHCR auth: set CI/CD variables GHCR_USER and GHCR_TOKEN
# (Settings → CI/CD → Variables, masked + protected).

stages:
  - Aggregates
  - Templates
  - Build
  - Test
  - Push
  - Clean

# ---------------------------------------------------------------------------
# Base job template
# ---------------------------------------------------------------------------
.job:
  tags:
    - linux
  when: manual
  needs: []
  cache:
    key: dockers-cache
    paths:
      - .cache
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - make $CI_JOB_NAME -j8

# ===========================================================================
# Aggregates
# ===========================================================================
.aggregates-job:
  extends: .job
  stage: Aggregates

build:
  extends: .aggregates-job

test:
  extends: .aggregates-job

push:
  extends: .aggregates-job

clean:
  extends: .aggregates-job

# ===========================================================================
# Templates — full cycle (build → test → push) per template
# ===========================================================================
.templates-job:
  extends: .job
  stage: Templates

tools:
  extends: .templates-job

dev:
  extends: .templates-job

clang:
  extends: .templates-job

go:
  extends: .templates-job

rust:
  extends: .templates-job

csharp:
  extends: .templates-job

nodejs:
  extends: .templates-job

mobile:
  extends: .templates-job

cross-clang:
  extends: .templates-job

cross-go:
  extends: .templates-job

cross-rust:
  extends: .templates-job

cross-csharp:
  extends: .templates-job

# ===========================================================================
# Build
# ===========================================================================
.build-job:
  extends: .job
  stage: Build

build-tools:
  extends: .build-job

build-dev:
  extends: .build-job

build-clang:
